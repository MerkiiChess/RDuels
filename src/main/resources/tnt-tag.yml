# Режим TNT Tag (горячая картошка). Активируется флагом "tnt-tag: true" у арены.
# Один игрок держит бомбу (светится); передача по удару. Когда фитиль истёк —
# держатель взрывается и выбывает, бомба переходит случайному живому. Последний живой — победитель.
# Обычный PvP-урон отключён — выбывает только держатель на взрыве.
enabled: true

# Длина фитиля в секундах
fuse-seconds: 15

# Тики после получения бомбы, в течение которых нельзя передать её обратно
pass-cooldown-ticks: 20
