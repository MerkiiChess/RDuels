# Границы арены и защита от пустоты (для активных бойцов).
enabled: true

# Y, ниже которого игрок считается «в пустоте»
void-min-y: 0

# Что делать при попадании в пустоту: TELEPORT_BACK (вернуть на спавн) или KILL (проигрыш раунда)
void-action: KILL

# Горизонтальный радиус от центра арены; 0 — отключить проверку выхода за границу
max-radius: 0

# За сколько блоков до границы начинать предупреждать; 0 — без предупреждений
warn-distance: 5

# Текст предупреждения в action bar; (blocks) — сколько блоков до границы
warn-message: "<red>Граница арены! Осталось <white>(blocks) <red>блоков"
