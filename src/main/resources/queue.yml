# Очереди по китам (/queue)
enabled: true

# Период работы матчмейкера в тиках (20 = раз в секунду)
match-interval-ticks: 20

# Количество раундов в матче из очереди
num-games: 1

# Ранкед-очередь: стартовая допустимая разница рейтинга между соперниками
ranked-elo-range: 100

# Ранкед-очередь: на сколько очков разница расширяется за каждую секунду ожидания
ranked-elo-range-per-second: 10
