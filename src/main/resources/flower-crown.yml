# Режим Flower Crown. Активируется флагом "flower-crown: true" у арены.
# Цветы принадлежат стороне, к спавну которой они ближе. Сломать цветок соперника
# = «украсть» (очко стороне); свои цветы ломать нельзя. Первая сторона до
# flowers-to-win украденных цветов побеждает.
enabled: true

# Сколько цветов нужно украсть для победы
flowers-to-win: 5

# Какие блоки считаются цветами (по материалу); пусто = все ванильные мелкие/высокие цветы
flower-materials: []
